# Local development services for PaxScan Online.
#   docker compose up -d postgres backend      # API on http://localhost:8000
#   docker compose run --rm backend php artisan test
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paxscan
      POSTGRES_PASSWORD: paxscan
      POSTGRES_DB: paxscan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paxscan -d paxscan"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    # Built-in server directly (not `artisan serve`, which drops most env vars) so DB_HOST reaches the app.
    # Laravel's router script expects public/ as the working directory (only for the server, not `run` commands).
    command: sh -c "cd public && exec php -S 0.0.0.0:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"
    ports:
      - "8000:8000"
    volumes:
      - ./paxscan-online/backend:/var/www/backend
      - composer-cache:/home/app/.composer
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  composer-cache:
